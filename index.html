<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Where Time Smiles</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖼️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Playfair+Display:ital,wght@0,500;1,600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* Moonlit Sapphire — unique palette for this site
       (preloader + lock + main all share it) */
    --space-0:  #0b1030;
    --cyan:     #6ea8fe;
    --cyan-2:   #b8c6ff;
    --violet:   #4c3d99;
    --pink:     #e8d5a8;
    --glass-bg:  rgba(18, 24, 60, 0.55);
    --glass-brd: rgba(184,198,255,0.22);
    --shadow-lg: 0 20px 60px rgba(5,8,30,0.55);
    --grad-cta:  linear-gradient(135deg, #6ea8fe 0%, #b8c6ff 55%, #4c3d99 100%);
  }

  html, body {
    height: 100%; margin: 0; padding: 0;
    font-family: 'Inter', system-ui, sans-serif;
    color: #eaf0ff;
    min-height: 100vh;
    overflow-x: hidden;
    background: #05081c;
  }
  body {
    background:
      radial-gradient(1400px 900px at 20% 10%, rgba(110,168,254,0.22) 0%, transparent 55%),
      radial-gradient(1200px 800px at 85% 90%, rgba(76,61,153,0.32) 0%, transparent 55%),
      radial-gradient(900px 700px at 60% 45%, rgba(184,198,255,0.10) 0%, transparent 60%),
      linear-gradient(160deg, #05081c 0%, #0b1030 55%, #0e1547 100%);
  }
  * { box-sizing: border-box; }

  /* ============ Interactive BOKEH-DRIFT background ============
     Soft blurred orbs of light drift slowly like photographic bokeh.
     Mouse gently pushes them, click blooms a ring. Unique to this site. */
  #bg-canvas {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* ===================== PRELOADER — Cosmic heart ===================== */
  #loader {
    position: fixed; inset: 0; z-index: 1500;
    background:
      radial-gradient(1200px 700px at 20% 10%, rgba(110,168,254,0.35) 0%, transparent 60%),
      radial-gradient(900px 700px at 90% 90%, rgba(76,61,153,0.40) 0%, transparent 55%),
      radial-gradient(ellipse at center, #0b1030 0%, #05081c 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity .7s ease; overflow: hidden;
  }
  #loader .stage { position: relative; width: 160px; height: 160px; display: flex; align-items: center; justify-content: center; }
  .loader-heart {
    width: 86px; height: 86px;
    animation: beat 1.1s ease-in-out infinite;
    filter: drop-shadow(0 10px 24px rgba(110,168,254,0.65)) drop-shadow(0 0 30px rgba(184,198,255,0.45));
  }
  .loader-heart svg { width: 100%; height: 100%; display: block; }
  @keyframes beat {
    0%,100% { transform: scale(1); }
    30% { transform: scale(1.22); }
    45% { transform: scale(.95); }
    65% { transform: scale(1.12); }
    80% { transform: scale(.98); }
  }
  #loader .petals { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  #loader .petal {
    position: absolute; bottom: -20px; width: 3px; height: 3px;
    background: #fff; border-radius: 50%;
    box-shadow: 0 0 6px #fff, 0 0 12px #b8c6ff;
    opacity: .8; animation: rise linear infinite;
  }
  @keyframes rise {
    0% { transform: translateY(0); opacity: 0; }
    10% { opacity: .95; }
    100% { transform: translateY(-110vh); opacity: 0; }
  }
  #loader .msg {
    margin-top: 28px; font-family:'Playfair Display', serif; font-style: italic;
    color: #eaf0ff; letter-spacing: .06em; font-size: 18px;
    min-height: 26px; text-align: center;
    text-shadow: 0 0 12px rgba(184,198,255,.55);
    animation: msgFade .6s ease;
  }
  #loader .dots { display:inline-block; width: 22px; text-align:left; }
  #loader .dots::after { content:''; animation: dots 1.4s steps(4, end) infinite; }
  @keyframes dots { 0%{content:'';} 25%{content:'.';} 50%{content:'..';} 75%{content:'...';} 100%{content:'';} }
  @keyframes msgFade { from { opacity:0; transform: translateY(6px);} to { opacity:1; transform:none;} }
  #loader .hint {
    margin-top: 10px; font-size: 12px; color: #b8c6ff;
    letter-spacing:.22em; text-transform: uppercase; opacity:.8;
    font-family: 'Orbitron', sans-serif;
  }

  /* ===================== LOCK — Cosmic glassmorphic keypad ===================== */
  #password-overlay {
    position: fixed; inset: 0; z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background:
      radial-gradient(1000px 600px at 20% 10%, rgba(110,168,254,0.32) 0%, transparent 60%),
      radial-gradient(800px 600px at 90% 90%, rgba(76,61,153,0.38) 0%, transparent 55%),
      rgba(5,8,28,0.72);
    backdrop-filter: blur(14px) saturate(140%);
    transition: opacity .5s ease;
  }
  #lock-box {
    width: 100%; max-width: 380px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-brd);
    border-radius: 24px;
    padding: 32px 28px 28px;
    backdrop-filter: blur(24px) saturate(160%);
    box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(184,198,255,0.15);
    text-align: center;
    animation: floatIn .7s cubic-bezier(.2,.9,.2,1.1) both;
    display: flex; flex-direction: column; align-items: center;
  }
  @keyframes floatIn { from { opacity: 0; transform: translateY(20px) scale(.96); } to { opacity: 1; transform: none; } }

  .lock-icon {
    width: 84px; height: 84px; margin: 0 auto 14px;
    position: relative; display: grid; place-items: center;
    border-radius: 50%;
    background: var(--grad-cta);
    box-shadow: 0 12px 30px rgba(110,168,254,.55), inset 0 2px 0 rgba(255,255,255,.35);
    animation: lockEntry 1.1s cubic-bezier(.2,.9,.2,1.3) both, lockBreath 3.6s ease-in-out 1.1s infinite;
  }
  .lock-icon::before {
    content: ''; position: absolute; inset: -14px; border-radius: 50%;
    border: 2px solid rgba(184,198,255,.65);
    opacity: 0; animation: haloRing 2.8s ease-out 1.2s infinite;
    pointer-events: none;
  }
  .lock-icon svg { width: 42px; height: 42px; color: white; position: relative; z-index: 1; overflow: visible; }
  .lock-icon .shackle {
    transition: transform .6s cubic-bezier(.5,-0.4,.3,1.6);
    transform-origin: 0% 100%;
    transform-box: fill-box;
    animation: shackleJiggle 4s ease-in-out 1.4s infinite;
  }
  .lock-icon.unlocked { animation: lockPop .8s cubic-bezier(.2,.9,.2,1.4) both; }
  .lock-icon.unlocked .shackle { transform: rotate(-48deg) translate(0,-10px); animation: none; }
  .lock-icon::after {
    content: ''; position: absolute; inset: -8px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(110,168,254,.75), transparent 70%);
    opacity: 0; transition: opacity .5s; pointer-events: none;
  }
  .lock-icon.unlocked::after { opacity: 1; animation: pulseGlow 1s ease-out; }
  .lock-icon.wrong { animation: duduNo .55s cubic-bezier(.36,.07,.19,.97) both; }
  .lock-icon.wrong svg { animation: gifPop .55s ease-out both; }
  .lock-icon.wrong::after {
    opacity: 1;
    background: radial-gradient(closest-side, rgba(232,213,168,.85), transparent 70%);
    animation: pulseGlow .6s ease-out;
  }
  @keyframes duduNo {
    0%, 100% { transform: translateX(0) rotate(0); }
    15% { transform: translateX(-10px) rotate(-4deg); }
    30% { transform: translateX(10px)  rotate(4deg); }
    45% { transform: translateX(-8px)  rotate(-3deg); }
    60% { transform: translateX(8px)   rotate(3deg); }
    80% { transform: translateX(-3px)  rotate(-1deg); }
  }
  @keyframes gifPop {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.12); }
    70%  { transform: scale(.96); }
    100% { transform: scale(1); }
  }
  @keyframes pulseGlow { 0% { transform: scale(.9); opacity: .9; } 100% { transform: scale(1.8); opacity: 0; } }
  @keyframes lockEntry {
    0%   { opacity: 0; transform: translateY(-30px) scale(.4) rotate(-18deg); }
    60%  { opacity: 1; transform: translateY(6px) scale(1.08) rotate(4deg); }
    80%  { transform: translateY(-2px) scale(.98) rotate(-2deg); }
    100% { opacity: 1; transform: none; }
  }
  @keyframes lockBreath {
    0%,100% { box-shadow: 0 12px 30px rgba(110,168,254,.55), inset 0 2px 0 rgba(255,255,255,.35); transform: scale(1); }
    50%     { box-shadow: 0 18px 44px rgba(184,198,255,.6), inset 0 2px 0 rgba(255,255,255,.5); transform: scale(1.04); }
  }
  @keyframes shackleJiggle {
    0%, 88%, 100% { transform: rotate(0) translateY(0); }
    92% { transform: rotate(-6deg) translateY(-1px); }
    96% { transform: rotate(5deg) translateY(-1px); }
  }
  @keyframes haloRing {
    0%   { opacity: .6; transform: scale(.85); }
    80%  { opacity: 0;   transform: scale(1.35); }
    100% { opacity: 0;   transform: scale(1.35); }
  }
  @keyframes lockPop {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.22) rotate(-6deg); }
    65%  { transform: scale(.94) rotate(3deg); }
    100% { transform: scale(1) rotate(0); }
  }
  #lock-box h3 {
    font-family: 'Orbitron', sans-serif;
    font-size: 20px; color: #eaf0ff; margin: 0 0 4px;
    letter-spacing: .05em;
    text-shadow: 0 0 12px rgba(184,198,255,.4);
  }
  #lock-box .sub {
    font-size: 13px; color: rgba(184,198,255,.75);
    margin: 0 0 18px;
    font-family: 'Inter', sans-serif;
  }
  #password-input {
    font-family: 'Orbitron', sans-serif;
    width: 100%; padding: 14px 16px;
    border-radius: 12px;
    border: 1.5px solid rgba(110,168,254,.35);
    background: rgba(11,16,48,.65);
    color: #fff;
    font-size: 1.25rem; text-align: center; letter-spacing: 8px;
    transition: all .25s ease;
    box-sizing: border-box;
  }
  #password-input:focus {
    outline: none; border-color: var(--cyan);
    background: rgba(11,16,48,.85);
    box-shadow: 0 0 0 4px rgba(110,168,254,.22);
  }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; width: 100%; }
  .key {
    padding: 14px 0; border-radius: 14px;
    border: 1px solid rgba(184,198,255,.15);
    background: rgba(255,255,255,.05);
    color: #eaf0ff;
    font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 600;
    cursor: pointer; user-select: none;
    transition: transform .12s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease;
    backdrop-filter: blur(8px);
    animation: keyIn .5s ease both;
  }
  .key:hover { background: rgba(110,168,254,.18); border-color: rgba(184,198,255,.55); }
  .key:active { transform: scale(.92); box-shadow: 0 4px 12px rgba(110,168,254,.35); }
  .key.action { background: var(--grad-cta); color: white; border: none; }
  .key.action:hover { filter: brightness(1.1); }
  .key.ghost { background: rgba(255,255,255,.03); }
  @keyframes keyIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .keypad .key:nth-child(1){animation-delay:.05s}.keypad .key:nth-child(2){animation-delay:.09s}
  .keypad .key:nth-child(3){animation-delay:.13s}.keypad .key:nth-child(4){animation-delay:.17s}
  .keypad .key:nth-child(5){animation-delay:.21s}.keypad .key:nth-child(6){animation-delay:.25s}
  .keypad .key:nth-child(7){animation-delay:.29s}.keypad .key:nth-child(8){animation-delay:.33s}
  .keypad .key:nth-child(9){animation-delay:.37s}.keypad .key:nth-child(10){animation-delay:.41s}
  .keypad .key:nth-child(11){animation-delay:.45s}.keypad .key:nth-child(12){animation-delay:.49s}
  #submit-button { display: none; }
  #error-message {
    color: #e8d5a8;
    font-family: 'Inter', sans-serif;
    font-size: .88rem; height: 1.1rem; margin-top: 10px; font-weight: 500;
    text-shadow: 0 0 8px rgba(232,213,168,.35);
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }
  .shake { animation: shake 0.3s ease-in-out; }
  #wrong-gif {
    display: none;
    width: 150px; height: 150px;
    border-radius: 18px;
    margin: 12px auto 0;
    object-fit: cover;
    box-shadow: 0 12px 28px rgba(110,168,254,.35), 0 0 0 1px rgba(184,198,255,.18);
  }
  #wrong-gif.show { display: block; animation: floatIn .3s ease both; }

  /* ===================== MAIN — Gallery ===================== */
  #main-content {
    position: relative;
    z-index: 10;
    opacity: 0;
    transition: opacity .6s ease;
    min-height: 100vh;
    display: flex; flex-direction: column;
  }
  #main-content.visible { opacity: 1; }

  header.gallery-header {
    text-align: center;
    padding: 3rem 1rem 1rem;
  }
  .gallery-title {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: clamp(1.9rem, 4vw, 2.8rem);
    color: #eaf0ff;
    margin: 0 0 .35rem;
    letter-spacing: .04em;
    text-shadow: 0 0 22px rgba(184,198,255,.45);
  }
  .gallery-sub {
    font-family: 'Orbitron', sans-serif;
    font-size: .78rem; letter-spacing: .3em; text-transform: uppercase;
    color: rgba(184,198,255,.7); margin: 0;
  }
  .count-pill {
    display: inline-block;
    margin-top: .7rem;
    padding: .35rem .9rem;
    border-radius: 999px;
    font-family: 'Orbitron', sans-serif;
    font-size: .72rem;
    letter-spacing: .18em;
    color: #b8c6ff;
    background: rgba(18,24,60,.55);
    border: 1px solid rgba(184,198,255,.2);
    backdrop-filter: blur(10px);
  }

  /* Toolbar */
  .toolbar {
    display: flex; justify-content: center; flex-wrap: wrap;
    gap: .55rem; padding: 1.25rem 1rem .5rem;
  }
  .tbtn {
    font-family: 'Orbitron', sans-serif; font-size: .74rem;
    letter-spacing: .12em; text-transform: uppercase;
    color: #eaf0ff;
    background: var(--glass-bg);
    border: 1px solid var(--glass-brd);
    padding: .6rem 1rem; border-radius: 999px;
    cursor: pointer; backdrop-filter: blur(10px) saturate(140%);
    transition: transform .2s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease;
    display: inline-flex; align-items: center; gap: .4rem;
  }
  .tbtn:hover { transform: translateY(-2px); border-color: rgba(184,198,255,.55); box-shadow: 0 8px 22px rgba(110,168,254,.3); }
  .tbtn.primary { background: var(--grad-cta); border: none; color: #fff; }
  .tbtn.primary:hover { filter: brightness(1.08); }

  /* Grid — CSS masonry-ish equal cells, native lazy-load handles 500+ */
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: .9rem;
    padding: 1rem clamp(1rem, 3vw, 2rem) 3rem;
    max-width: 1400px;
    width: 100%;
    margin: 0 auto;
  }
  @media (min-width: 700px) {
    #grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
  }
  .tile {
    position: relative;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    border-radius: 14px;
    background: linear-gradient(135deg, rgba(110,168,254,.12), rgba(76,61,153,.18));
    border: 1px solid rgba(184,198,255,.12);
    cursor: pointer;
    transition: transform .35s cubic-bezier(.2,.9,.2,1.1), box-shadow .35s ease, border-color .3s ease;
    box-shadow: 0 8px 20px rgba(0,0,0,.35);
    contain: layout paint style;
  }
  .tile::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 55%, rgba(5,8,28,.55) 100%);
    opacity: 0; transition: opacity .3s ease;
    pointer-events: none;
  }
  .tile:hover::after { opacity: 1; }
  .tile img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
    transition: transform .6s ease, opacity .5s ease;
    opacity: 0;
  }
  .tile img.loaded { opacity: 1; }
  .tile:hover {
    transform: translateY(-4px) scale(1.02);
    border-color: rgba(184,198,255,.55);
    box-shadow: 0 20px 40px rgba(110,168,254,.4);
  }
  .tile:hover img { transform: scale(1.08); }
  .tile .num {
    position: absolute; top: 8px; left: 10px;
    z-index: 2;
    font-family: 'Orbitron', sans-serif;
    font-size: .68rem; letter-spacing: .15em;
    color: rgba(234,240,255,.75);
    text-shadow: 0 1px 4px rgba(0,0,0,.7);
    background: rgba(11,16,48,.45);
    padding: .18rem .5rem; border-radius: 999px;
    backdrop-filter: blur(6px);
    opacity: 0; transition: opacity .3s ease;
  }
  .tile:hover .num { opacity: 1; }

  .empty {
    text-align: center; padding: 4rem 1rem;
    color: rgba(184,198,255,.55);
    font-family: 'Playfair Display', serif;
    font-style: italic;
  }

  /* Lightbox */
  #lightbox {
    position: fixed; inset: 0; z-index: 900;
    display: none;
    align-items: center; justify-content: center;
    background: rgba(3,5,20,.9);
    backdrop-filter: blur(14px) saturate(140%);
    padding: 2rem;
  }
  #lightbox.show { display: flex; animation: floatIn .35s ease both; }
  .lb-inner {
    position: relative;
    max-width: min(94vw, 1200px);
    max-height: 90vh;
    display: flex; flex-direction: column; align-items: center;
  }
  .lb-img-wrap {
    position: relative;
    max-width: 100%; max-height: 80vh;
    border-radius: 14px; overflow: hidden;
    box-shadow: 0 40px 100px rgba(0,0,0,.7), 0 0 0 1px rgba(184,198,255,.18);
    background: #0b1030;
    min-width: 200px; min-height: 200px;
  }
  .lb-img-wrap img {
    display: block;
    max-width: min(94vw, 1200px);
    max-height: 80vh;
    object-fit: contain;
  }
  .lb-caption {
    margin-top: .75rem;
    font-family: 'Playfair Display', serif; font-style: italic;
    color: #eaf0ff; font-size: 1rem; text-align: center;
    text-shadow: 0 0 12px rgba(184,198,255,.4);
  }
  .lb-counter {
    font-family: 'Orbitron', sans-serif;
    font-size: .72rem; letter-spacing: .2em;
    color: rgba(184,198,255,.7);
    margin-top: .35rem;
  }
  .lb-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 48px; height: 48px; border-radius: 50%;
    background: var(--glass-bg); border: 1px solid var(--glass-brd);
    color: #eaf0ff; font-size: 22px;
    display: grid; place-items: center; cursor: pointer;
    backdrop-filter: blur(10px);
    transition: transform .2s ease, background .2s ease;
    z-index: 5;
  }
  .lb-btn:hover { background: rgba(110,168,254,.25); transform: translateY(-50%) scale(1.08); }
  .lb-prev { left: -60px; }
  .lb-next { right: -60px; }
  .lb-close {
    position: absolute; top: -50px; right: 0;
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--glass-bg); border: 1px solid var(--glass-brd);
    color: #eaf0ff; cursor: pointer;
    display: grid; place-items: center;
    backdrop-filter: blur(10px);
  }
  .lb-close:hover { background: rgba(232,213,168,.25); }
  @media (max-width: 800px) {
    .lb-prev { left: 8px; } .lb-next { right: 8px; }
    .lb-close { top: 8px; right: 8px; }
  }

  /* Slideshow progress bar */
  .lb-progress {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 3px; background: rgba(184,198,255,.15);
    overflow: hidden;
  }
  .lb-progress-bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--cyan), var(--cyan-2));
    transition: width .1s linear;
    box-shadow: 0 0 12px var(--cyan);
  }

  /* ===================== MUSIC PLAYER ===================== */
  #music-toggle {
    position: fixed; right: 22px; top: 50%; transform: translateY(-50%);
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--glass-bg);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--glass-brd);
    box-shadow: 0 10px 30px rgba(5,8,30,0.55), 0 0 20px rgba(110,168,254,0.25);
    color: #eaf0ff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    z-index: 900;
    transition: transform .25s ease, box-shadow .25s ease;
  }
  #music-toggle:hover { transform: translateY(-50%) scale(1.08); box-shadow: 0 12px 36px rgba(5,8,30,0.65), 0 0 28px rgba(110,168,254,0.45); }
  #music-toggle svg { width: 24px; height: 24px; }
  #music-toggle.playing { animation: musicPulse 2s ease-in-out infinite; }
  @keyframes musicPulse {
    0%,100% { box-shadow: 0 10px 30px rgba(5,8,30,0.55), 0 0 20px rgba(110,168,254,0.35); }
    50%     { box-shadow: 0 10px 30px rgba(5,8,30,0.55), 0 0 34px rgba(184,198,255,0.7); }
  }
  #music-panel {
    position: fixed; right: 90px; top: 50%; transform: translateY(-50%) translateX(20px);
    width: 260px; padding: 16px;
    background: var(--glass-bg);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--glass-brd);
    border-radius: 18px;
    box-shadow: var(--shadow-lg);
    z-index: 899;
    opacity: 0; pointer-events: none;

<body>

<script>
/* ==================================================================
   PHOTOS — the ONLY place you edit to add pictures.
   ------------------------------------------------------------------
   Recommended (works for 500+ photos):
     1. Create a folder "photos/" next to this HTML file in your repo.
     2. Push your images there (jpg / png / webp — any names work).
     3. Add one entry per image below. Only "src" is required.

   You can also use direct hosted URLs (imgur, cloudinary, github raw).
   Google Drive share links will NOT work as <img src>.

   The grid + lightbox are built to handle hundreds of photos smoothly
   using native lazy loading + async image decoding.
   ================================================================== */
/* Pre-generated slots for photos/1.jpg ... photos/100.jpg
   Just drop images named 1.jpg, 2.jpg, ... into the /photos folder in your repo.
   Missing numbers are auto-hidden. Add captions inline where you like. */
const PHOTOS = Array.from({ length: 100 }, (_, i) => ({
  src: `photos/${i + 1}.jpg`,
  caption: ""
}));
// Track which slots actually loaded so the grid + lightbox skip empty numbers
const missing = new Set();


/* ---------- Cosmic loader ---------- */
(function initLoader(){
  const petals = document.getElementById('loaderPetals');
  if (petals) {
    for (let i = 0; i < 40; i++) {
      const p = document.createElement('span');
      p.className = 'petal';
      p.style.left = Math.random() * 100 + '%';
      const dur = 6 + Math.random() * 8;
      p.style.animationDuration = dur + 's';
      p.style.animationDelay = (-Math.random() * dur) + 's';
      const size = 2 + Math.random() * 3;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.opacity = (.5 + Math.random() * .5).toFixed(2);
      petals.appendChild(p);
    }
  }
  const msgEl = document.getElementById('loaderMsg');
  const messages = [
    'polishing our memories',
    'threading the moonlight',
    'gathering little smiles',
    'framing every heartbeat',
    'almost ready for you'
  ];
  let mi = 0;
  const msgTimer = setInterval(() => {
    if (!msgEl) return;
    mi = (mi + 1) % messages.length;
    msgEl.style.animation = 'none';
    void msgEl.offsetWidth;
    msgEl.style.animation = '';
    msgEl.textContent = messages[mi];
  }, 1600);

  const dismiss = () => {
    clearInterval(msgTimer);
    const l = document.getElementById('loader');
    if (!l) return;
    l.style.opacity = '0';
    setTimeout(() => l.remove(), 700);
  };
  if (document.readyState === 'complete') setTimeout(dismiss, 1200);
  else window.addEventListener('load', () => setTimeout(dismiss, 1200));
  setTimeout(dismiss, 3500);
})();

document.addEventListener('DOMContentLoaded', () => {
  /* ---------- Cosmic Lock ---------- */
  const passwordOverlay = document.getElementById('password-overlay');
  const lockBox = document.getElementById('lock-box');
  const passwordInput = document.getElementById('password-input');
  const errorMessage = document.getElementById('error-message');
  const mainContent = document.getElementById('main-content');
  const lockIcon = document.getElementById('lockIcon');
  const wrongGif = document.getElementById('wrong-gif');
  const correctPassword = "28072018";

  const showMain = () => mainContent.classList.add('visible');

  if (sessionStorage.getItem('isUnlocked') === 'true') {
    passwordOverlay.style.display = 'none';
    showMain();
  }

  document.getElementById('keypad').addEventListener('click', (e) => {
    const k = e.target.closest('.key');
    if (!k) return;
    const v = k.dataset.k;
    if (!v) return;
    if (v === 'clear') passwordInput.value = passwordInput.value.slice(0, -1);
    else if (passwordInput.value.length < 8) passwordInput.value += v;
  });

  lockBox.addEventListener('submit', (e) => {
    e.preventDefault();
    if (passwordInput.value === correctPassword) {
      sessionStorage.setItem('isUnlocked', 'true');
      if (wrongGif) wrongGif.classList.remove('show');
      lockIcon.classList.add('unlocked');
      setTimeout(() => {
        passwordOverlay.style.opacity = '0';
        setTimeout(() => { passwordOverlay.style.display = 'none'; }, 500);
        showMain();
      }, 600);
    } else {
      errorMessage.textContent = 'Wrong Password. Try Again!';
      lockBox.classList.add('shake');
      lockIcon.classList.add('wrong');
      if (wrongGif) {
        wrongGif.classList.remove('show');
        void wrongGif.offsetWidth;
        wrongGif.classList.add('show');
      }
      passwordInput.value = '';
      setTimeout(() => {
        lockBox.classList.remove('shake');
        lockIcon.classList.remove('wrong');
      }, 600);
      setTimeout(() => {
        errorMessage.textContent = '';
        if (wrongGif) wrongGif.classList.remove('show');
      }, 2200);
    }
  });

  /* ---------- Gallery Grid (scales to hundreds) ---------- */
  const grid = document.getElementById('grid');
  const countPill = document.getElementById('count-pill');

  const updateCount = () => {
    const n = PHOTOS.length - missing.size;
    countPill.textContent = `${n} memor${n === 1 ? 'y' : 'ies'}`;
  };
  updateCount();

  if (!PHOTOS.length) {
    grid.innerHTML = '<div class="empty">No memories yet — add some to the PHOTOS array in this file.</div>';
  } else {
    const frag = document.createDocumentFragment();
    PHOTOS.forEach((ph, i) => {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.dataset.i = i;
      tile.innerHTML = `
        <span class="num">${String(i + 1).padStart(3, '0')}</span>
        <img loading="lazy" decoding="async" src="${ph.src}" alt="${(ph.caption || '').replace(/"/g,'&quot;')}">
      `;
      const img = tile.querySelector('img');
      if (img.complete && img.naturalWidth > 0) img.classList.add('loaded');
      else img.addEventListener('load', () => img.classList.add('loaded'), { once: true });
      img.addEventListener('error', () => {
        // Slot has no uploaded photo yet — hide it entirely
        missing.add(i);
        tile.remove();
        updateCount();
      });
      frag.appendChild(tile);
    });
    grid.appendChild(frag);

    grid.addEventListener('click', (e) => {
      const tile = e.target.closest('.tile');
      if (!tile) return;
      openLightbox(parseInt(tile.dataset.i, 10));
    });
  }


  /* ---------- Lightbox + Slideshow ---------- */
  const lb = document.getElementById('lightbox');
  const lbImg = document.getElementById('lb-img');
  const lbCap = document.getElementById('lb-caption');
  const lbCounter = document.getElementById('lb-counter');
  const progressBar = document.getElementById('lb-progress-bar');
  let lbIdx = 0, slideTimer = null, slideProgress = null;
  const SLIDE_MS = 3200;

  function preloadNeighbors(i){
    [i - 1, i + 1].forEach(k => {
      if (k >= 0 && k < PHOTOS.length) {
        const im = new Image(); im.decoding = 'async'; im.src = PHOTOS[k].src;
      }
    });
  }
  function openLightbox(i){
    lbIdx = i;
    updateLightbox();
    lb.classList.add('show');
    document.body.style.overflow = 'hidden';
  }
  function updateLightbox(){
    const p = PHOTOS[lbIdx];
    if (!p) return;
    lbImg.src = p.src;
    lbImg.alt = p.caption || '';
    lbCap.textContent = p.caption || '';
    const total = PHOTOS.length - missing.size;
    // position among visible ones
    let pos = 0;
    for (let k = 0; k <= lbIdx; k++) if (!missing.has(k)) pos++;
    lbCounter.textContent = `${pos} / ${total}`;
    preloadNeighbors(lbIdx);
  }
  function closeLightbox(){
    lb.classList.remove('show');
    document.body.style.overflow = '';
    stopSlideshow();
  }
  function next(){
    if (missing.size >= PHOTOS.length) return;
    do { lbIdx = (lbIdx + 1) % PHOTOS.length; } while (missing.has(lbIdx));
    updateLightbox(); resetProgress();
  }
  function prev(){
    if (missing.size >= PHOTOS.length) return;
    do { lbIdx = (lbIdx - 1 + PHOTOS.length) % PHOTOS.length; } while (missing.has(lbIdx));
    updateLightbox(); resetProgress();
  }


  function resetProgress(){
    if (!slideTimer) return;
    slideProgress = performance.now();
    progressBar.style.width = '0%';
  }
  function stopSlideshow(){
    if (slideTimer) { clearInterval(slideTimer); slideTimer = null; }
    progressBar.style.width = '0%';
    slideProgress = null;
  }
  function startSlideshow(){
    if (!PHOTOS.length) return;
    openLightbox(lbIdx || 0);
    stopSlideshow();
    slideProgress = performance.now();
    const tick = () => {
      if (!slideProgress) return;
      const pct = Math.min(100, ((performance.now() - slideProgress) / SLIDE_MS) * 100);
      progressBar.style.width = pct + '%';
      if (pct >= 100) next();
      slideTimer = requestAnimationFrame(tick);
    };
    slideTimer = requestAnimationFrame(tick);
    // wrap requestAnimationFrame so stopSlideshow() cancels via clearInterval-like path
    const origStop = stopSlideshow;
  }
  // simpler: use setInterval for advance, rAF just for progress
  function startSlideshowSimple(){
    if (!PHOTOS.length) return;
    if (slideTimer) { stopSlideshow(); return; }
    openLightbox(lbIdx || 0);
    slideProgress = performance.now();
    slideTimer = setInterval(() => {
      slideProgress = performance.now();
      next();
    }, SLIDE_MS);
    // animate bar
    const animate = () => {
      if (!slideTimer) return;
      const pct = Math.min(100, ((performance.now() - slideProgress) / SLIDE_MS) * 100);
      progressBar.style.width = pct + '%';
      requestAnimationFrame(animate);
    };
    requestAnimationFrame(animate);
  }

  document.getElementById('lb-close').addEventListener('click', closeLightbox);
  document.getElementById('lb-next').addEventListener('click', () => { next(); });
  document.getElementById('lb-prev').addEventListener('click', () => { prev(); });
  lb.addEventListener('click', (e) => { if (e.target === lb) closeLightbox(); });
  window.addEventListener('keydown', (e) => {
    if (!lb.classList.contains('show')) return;
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowRight') next();
    else if (e.key === 'ArrowLeft') prev();
    else if (e.key === ' ') { e.preventDefault(); startSlideshowSimple(); }
  });
  document.getElementById('btn-slideshow').addEventListener('click', startSlideshowSimple);

  /* ---------- Bokeh-drift interactive background ---------- */
  (function initBg(){
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
    const orbs = [];
    const blooms = [];
    const mouse = { x: -9999, y: -9999, active: false };
    // soft, dreamy palette variations
    const PAL = [
      [110,168,254], // sapphire
      [184,198,255], // moonstone
      [232,213,168], // champagne
      [140,120,220], // twilight lilac
      [90,140,230]   // deep sapphire
    ];

    function resize(){
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = W * dpr; canvas.height = H * dpr;
      canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', () => { resize(); seed(); });

    function seed(){
      orbs.length = 0;
      // depth-layered orbs — big blurry background ones + smaller sharp foreground
      const count = Math.min(28, Math.floor((W * H) / 60000));
      for (let i = 0; i < count; i++){
        const depth = Math.random(); // 0 = far, 1 = near
        const r = 40 + depth * 130 + Math.random() * 40;
        const c = PAL[Math.floor(Math.random() * PAL.length)];
        orbs.push({
          x: Math.random() * W,
          y: Math.random() * H,
          vx: (Math.random() - .5) * (0.15 + depth * 0.35),
          vy: (Math.random() - .5) * (0.15 + depth * 0.35),
          r,
          depth,
          alpha: 0.10 + depth * 0.30,
          c,
          // gentle sinusoidal drift
          phase: Math.random() * Math.PI * 2,
          freq: 0.0005 + Math.random() * 0.0009
        });
      }
    }
    seed();

    window.addEventListener('pointermove', (e) => {
      mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
    });
    window.addEventListener('pointerleave', () => { mouse.active = false; mouse.x = -9999; mouse.y = -9999; });
    window.addEventListener('pointerdown', (e) => {
      const c = PAL[Math.floor(Math.random() * PAL.length)];
      blooms.push({ x: e.clientX, y: e.clientY, r: 0, alpha: .55, c });
    });

    function step(t){
      // trailing wash for that dreamy motion-blur bokeh look
      ctx.fillStyle = 'rgba(5, 8, 28, 0.28)';
      ctx.fillRect(0, 0, W, H);

      // draw orbs (back to front)
      orbs.sort((a,b) => a.depth - b.depth);
      for (const o of orbs){
        // gentle sway
        o.x += o.vx + Math.sin(t * o.freq + o.phase) * 0.15;
        o.y += o.vy + Math.cos(t * o.freq + o.phase) * 0.15;

        // mouse push (feels like light responding)
        if (mouse.active){
          const dx = o.x - mouse.x, dy = o.y - mouse.y;
          const d2 = dx*dx + dy*dy;
          const R = 220;
          if (d2 < R*R && d2 > 0.1){
            const d = Math.sqrt(d2);
            const f = (R - d) / R;
            o.vx += (dx / d) * f * 0.08 * o.depth;
            o.vy += (dy / d) * f * 0.08 * o.depth;
          }
        }
        o.vx *= 0.985; o.vy *= 0.985;

        // wrap
        if (o.x < -o.r) o.x = W + o.r;
        if (o.x > W + o.r) o.x = -o.r;
        if (o.y < -o.r) o.y = H + o.r;
        if (o.y > H + o.r) o.y = -o.r;

        // draw radial soft orb
        const g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.r);
        const [r,gc,b] = o.c;
        g.addColorStop(0, `rgba(${r},${gc},${b},${o.alpha})`);
        g.addColorStop(0.35, `rgba(${r},${gc},${b},${o.alpha * 0.45})`);
        g.addColorStop(1, `rgba(${r},${gc},${b},0)`);
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
        ctx.fill();

        // sparkly core on nearer orbs
        if (o.depth > 0.55){
          ctx.fillStyle = `rgba(255,255,255,${0.35 * o.depth})`;
          ctx.beginPath();
          ctx.arc(o.x, o.y, 1.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // blooms on click
      for (let i = blooms.length - 1; i >= 0; i--){
        const bl = blooms[i];
        bl.r += 3.5; bl.alpha *= 0.955;
        const [r,gc,b] = bl.c;
        // filled soft ring
        const g = ctx.createRadialGradient(bl.x, bl.y, Math.max(0, bl.r - 30), bl.x, bl.y, bl.r + 20);
        g.addColorStop(0, `rgba(${r},${gc},${b},0)`);
        g.addColorStop(0.7, `rgba(${r},${gc},${b},${bl.alpha})`);
        g.addColorStop(1, `rgba(${r},${gc},${b},0)`);
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(bl.x, bl.y, bl.r + 20, 0, Math.PI * 2);
        ctx.fill();
        if (bl.alpha < 0.02 || bl.r > Math.max(W, H)) blooms.splice(i, 1);
      }

      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
});
</script>

<script>
  // ==== Add your songs to /music/ folder in GitHub and list them here ====
  const TRACKS = [
    { title: "Track 1", src: "music/1.mp3" },
    { title: "Track 2", src: "music/2.mp3" },
    { title: "Track 3", src: "music/3.mp3" },
    { title: "Track 4", src: "music/4.mp3" },
    { title: "Track 5", src: "music/5.mp3" },
    { title: "Track 6", src: "music/6.mp3" },
  ];

  (function initMusic(){
    const btn   = document.getElementById('music-toggle');
    const panel = document.getElementById('music-panel');
    const list  = document.getElementById('track-list');
    const audio = document.getElementById('music-audio');
    let currentIdx = 0;
    let isPlaying  = false;

    const iconPlay  = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`;
    const iconPause = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>`;

    TRACKS.forEach((t, i) => {
      const item = document.createElement('div');
      item.className = 'track-item' + (i === 0 ? ' active' : '');
      item.innerHTML = `<span class="track-dot"></span><span>${t.title}</span>`;
      item.addEventListener('click', () => selectTrack(i, true));
      list.appendChild(item);
    });

    function selectTrack(i, autoplay){
      currentIdx = i;
      document.querySelectorAll('.track-item').forEach((el, idx) =>
        el.classList.toggle('active', idx === i));
      audio.src = TRACKS[i].src;
      if (autoplay) {
        audio.play().then(() => setPlaying(true)).catch(() => setPlaying(false));
      }
    }

    function setPlaying(state){
      isPlaying = state;
      btn.classList.toggle('playing', state);
      btn.innerHTML = state ? iconPause : iconPlay;
    }

    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!audio.src) audio.src = TRACKS[currentIdx].src;
      if (isPlaying) {
        audio.pause();
        setPlaying(false);
      } else {
        audio.play().then(() => setPlaying(true)).catch(() => setPlaying(false));
      }
      panel.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
      if (!panel.contains(e.target) && e.target !== btn) panel.classList.remove('open');
    });

    audio.addEventListener('ended', () => setPlaying(false));
    audio.addEventListener('pause', () => { if (!audio.ended) setPlaying(false); });
    audio.addEventListener('play',  () => setPlaying(true));
  })();
</script>
</body>
</html>
